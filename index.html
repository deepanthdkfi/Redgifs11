                  {/* PROMINENT APK DOWNLOAD BANNER */}

                  {/* Stats Row */}

                    </div>

                    <div className="glass-card rounded-2xl p-3.5 flex items-center gap-3">

                        <Icons.Download />
                      </div>
                      <div>
                        <div className="text-lg font-black font-mono text-slate-100">1DM Sniffer</div>

                    <div className="glass-card rounded-2xl p-3.5 flex items-center gap-3">

                  {/* Speed Dial Shortcuts */}

                    <div className="grid grid-cols-4 sm:grid-cols-7 gap-3">

                        <div
                          key={item.id}
                          onClick={() => handleNavigate(item.url)}

          {/* 1. MEDIA SNIFFER MODAL (1DM Multi-Bitrate & M3U8 Stream Fetcher) */}

            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4 animate-fade-in">
              <div className="bg-slate-900 border border-slate-700/80 rounded-3xl w-full max-w-4xl h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                <header className="px-5 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/90">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow">

                    <div>
                      <h2 className="text-base font-bold text-white">Soul 1DM Media Sniffer</h2>

                  </div>
                  <button onClick={() => setIsMediaSnifferOpen(false)} className="p-2 rounded-2xl bg-slate-800 text-slate-400 hover:text-white">
                    <Icons.X />
                  </button>
                </header>

                <div className="flex-1 overflow-y-auto p-5 space-y-4">
                  {activeTab.media?.videos?.map(v => (
                    <div key={v.id} className="glass-card rounded-2xl p-4 flex flex-col space-y-3 border border-slate-800">
                      <div className="flex items-start gap-3">

                          <img src={v.poster} alt="" className="w-full h-full object-cover" />

                            {v.isM3U8 ? 'M3U8 HLS' : 'MP4 4K'}
                          </span>
                        </div>
                        <div className="flex-1 min-w-0">
                          <h4 className="text-sm font-bold text-slate-100 truncate">{v.title}</h4>
                          <div className="flex items-center gap-2 mt-1 text-xs text-slate-400">
                            <span className="px-2 py-0.5 rounded bg-slate-800 text-sky-400 font-mono font-bold">{v.resolution}</span>
                            <span className="text-[11px] font-mono text-emerald-400">Original Stream</span>
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center gap-2 pt-2 border-t border-slate-800">
                        <button
                          onClick={() => {
                            setActiveVideoModal(v);
                            setIsMediaSnifferOpen(false);
                          }}
                          className="flex-1 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow"
                        >
                          <Icons.Play />
                          <span>Soul Player</span>
                        </button>

                        <a
                          href={`/api/download/m3u8?url=${encodeURIComponent(v.url)}&title=${encodeURIComponent(v.title)}`}

                          onClick={() => showToast(`1DM Download Started: ${v.title}`)}
                          className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow"
                        >
                          <Icons.Download />
                          <span>1DM Download (1080p)</span>
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* 2. SOUL CUSTOM GESTURE VIDEO PLAYER (HLS M3U8 Native Support) */}
          {activeVideoModal && (
            <div className="fixed inset-0 z-50 bg-black flex flex-col justify-between p-4 animate-fade-in select-none">
              <div className="flex items-center justify-between text-white z-50">
                <button onClick={() => setActiveVideoModal(null)} className="p-2 rounded-2xl bg-white/10 hover:bg-white/20">

                <div className="text-center">
                  <h3 className="text-sm font-bold truncate">{activeVideoModal.title}</h3>
                  <p className="text-[10px] text-sky-400 font-mono">1080p HD • Soul Gesture Player</p>

                <div className="w-8"></div>

              <div className="flex-1 flex items-center justify-center relative">
                <video

                  playsInline

              <div className="p-3 bg-slate-900/80 backdrop-blur-md rounded-2xl flex items-center justify-between text-xs text-slate-300">

                <span className="font-bold text-sky-400">0.5x - 3x Speed</span>

            </div>

          {/* 3. SOUL ACTION MENU SHEET */}
          {isSoulMenuOpen && (
            <div onClick={() => setIsSoulMenuOpen(false)} className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/70 backdrop-blur-sm p-4 animate-fade-in">
              <div onClick={(e) => e.stopPropagation()} className="w-full sm:max-w-md bg-slate-900 border border-slate-700/80 rounded-3xl p-5 shadow-2xl space-y-4">

                <div className="grid grid-cols-3 gap-2.5">
                  <a
                    href="/SoulX-Browser-v2.5.0.apk"

                  </button>

                  <button
                    onClick={() => {
                      setIsMediaSnifferOpen(true);
                      setIsSoulMenuOpen(false);
                    }}
                    className="flex flex-col items-center p-3 rounded-2xl bg-slate-950 border border-slate-800 text-sky-400 font-bold text-xs"

    }

    ReactDOM.render(<SoulXBrowserApp />, document.getElementById('root'));
  </script>
